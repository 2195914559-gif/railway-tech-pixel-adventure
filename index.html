<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#03143a">
  <meta name="description" content="前方到站，世界一流！——铁世一的铁路科技像素冒险">
  <meta property="og:title" content="前方到站，世界一流！">
  <meta property="og:description" content="铁世一带你走遍智慧车站、高速列车、安全防线与世界一流铁路网，一起解锁铁路科技档案。">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/ui/railway-emblem.svg" type="image/svg+xml">
  <title>前方到站，世界一流！</title>
  <link rel="stylesheet" href="css/game.css?v=20260830-web1">
</head>
<body>
  <div id="boot-screen" class="screen boot-screen" aria-live="polite">
    <div class="boot-emblem"><img src="assets/ui/railway-emblem.svg" alt=""></div>
    <p>铁路科技世界正在接轨<span class="loading-dots">...</span></p>
    <div class="boot-bar" role="progressbar" aria-label="加载进度"><span id="boot-bar-fill" class="boot-bar-fill"></span></div>
    <span id="boot-percent" class="boot-percent">0%</span>
    <p class="boot-tip">首次进入需下载约 3 MB 素材，请保持网络畅通</p>
  </div>

  <main id="app" class="app" hidden>
    <section id="cover-screen" class="screen cover-screen" aria-label="游戏主菜单">
      <div class="cover-stage">
        <nav class="cover-menu" aria-label="主菜单">
          <button id="start-button" class="art-button art-button-main" type="button" aria-label="开始探索">
            <img src="assets/ui/button-start.webp" alt="开始探索">
          </button>
          <button id="cover-archive-button" class="art-button" type="button" aria-label="铁路科技档案">
            <img src="assets/ui/button-archive.webp" alt="铁路科技档案">
          </button>
          <button id="exit-button" class="art-button" type="button" aria-label="退出游戏">
            <img src="assets/ui/button-exit.webp" alt="退出游戏">
          </button>
          <p id="save-status" class="save-status">尚未建立探索档案</p>
        </nav>
        <div class="cover-corner-actions">
          <button id="cover-audio-button" class="round-button" type="button" aria-label="切换声音">♫</button>
        </div>
      </div>
    </section>

    <div id="start-choice-overlay" class="modal-overlay" hidden>
      <section class="start-choice-panel" role="dialog" aria-modal="true" aria-labelledby="start-choice-title">
        <span class="panel-kicker">EXPLORATION ARCHIVE</span>
        <h2 id="start-choice-title">检测到探索存档</h2>
        <p id="start-choice-summary">请选择继续当前进度，或从第一站重新开始。</p>
        <button id="continue-game-button" class="pixel-action" type="button">继续游戏</button>
        <button id="restart-game-button" class="pixel-action secondary" type="button">重新开始</button>
        <button id="start-choice-close" class="text-button" type="button">返回主菜单</button>
      </section>
    </div>

    <section id="intro-screen" class="screen intro-screen" hidden aria-label="开场视频">
      <video id="intro-video" preload="auto" playsinline webkit-playsinline x5-playsinline>
        <source src="assets/video/intro-placeholder.mp4" type="video/mp4">
      </video>
      <div class="intro-vignette"></div>
      <div class="intro-label">
        <strong id="intro-time">00:00 / 00:51</strong>
      </div>
      <button id="skip-intro-button" class="pixel-action skip-action" type="button">跳过视频 <span>››</span></button>
      <div id="intro-error" class="intro-error" hidden>
        <p>开场视频暂时无法播放</p>
        <button id="intro-error-skip" class="pixel-action" type="button">直接开始探索</button>
      </div>
    </section>

    <section id="game-screen" class="screen game-screen" hidden aria-label="游戏场景">
      <div id="game-stage" class="game-stage">
        <canvas id="game-canvas" width="1600" height="900" aria-label="铁路科技探索地图"></canvas>
        <div class="scanlines" aria-hidden="true"></div>

        <header class="hud">
          <div class="mission-card">
            <span id="chapter-number" class="chapter-number">第一站</span>
            <strong id="chapter-title">智慧车站</strong>
            <p id="mission-text">帮助三位旅客解决出行难题</p>
            <div id="task-pips" class="task-pips" aria-label="任务进度"></div>
          </div>
          <div class="hud-actions">
            <button id="audio-button" class="hud-button" type="button" aria-label="切换声音">♫</button>
            <button id="archive-button" class="hud-button" type="button" aria-label="打开铁路科技档案">▣</button>
            <button id="pause-button" class="hud-button" type="button" aria-label="暂停游戏">Ⅱ</button>
          </div>
        </header>

        <div id="interact-hint" class="interact-hint" hidden>
          <kbd>空格</kbd>
          <span id="interact-label">交互</span>
        </div>

        <div id="chapter-card" class="chapter-card" hidden>
          <span id="chapter-card-number">第一站</span>
          <strong id="chapter-card-title">智慧车站・一张车票的旅程</strong>
          <p id="chapter-card-objective">帮助三位旅客解决出行难题</p>
        </div>
      </div>

      <div id="touch-controls" class="touch-controls" aria-label="触屏控制">
        <div class="dpad" aria-label="移动方向">
          <button class="touch-key up" data-key="ArrowUp" type="button" aria-label="向上">▲</button>
          <button class="touch-key left" data-key="ArrowLeft" type="button" aria-label="向左">◀</button>
          <button class="touch-key down" data-key="ArrowDown" type="button" aria-label="向下">▼</button>
          <button class="touch-key right" data-key="ArrowRight" type="button" aria-label="向右">▶</button>
        </div>
        <button id="touch-interact" class="touch-interact" type="button" aria-label="交互">A<span>交互</span></button>
      </div>
    </section>

    <div id="dialog-overlay" class="modal-overlay" hidden>
      <section class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dialog-speaker">
        <div class="dialog-head">
          <span class="portrait-chip"><img src="assets/ui/railway-emblem.svg" alt=""></span>
          <strong id="dialog-speaker">铁世一</strong>
          <button id="dialog-close" class="close-button" type="button" aria-label="关闭对话">×</button>
        </div>
        <h3 id="dialog-topic" class="dialog-topic"></h3>
        <p id="dialog-text" class="dialog-text"></p>
        <div id="dialog-choices" class="dialog-choices"></div>
        <button id="dialog-next" class="pixel-action dialog-next" type="button" hidden>继续</button>
        <div class="dialog-tip">空格 / 回车继续</div>
      </section>
    </div>

    <div id="archive-overlay" class="modal-overlay" hidden>
      <section class="archive-panel" role="dialog" aria-modal="true" aria-labelledby="archive-title">
        <header class="panel-header">
          <div>
            <span>RAILWAY TECH FILES</span>
            <h2 id="archive-title">铁路科技档案</h2>
          </div>
          <button id="archive-close" class="close-button" type="button" aria-label="关闭档案">×</button>
        </header>
        <div id="badge-row" class="badge-row"></div>
        <div id="archive-list" class="archive-list"></div>
        <p id="archive-empty" class="empty-state">继续探索，新的铁路科技知识会自动收录在这里。</p>
      </section>
    </div>

    <div id="image-viewer-overlay" class="image-viewer-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="image-viewer-caption">
      <button id="image-viewer-close" class="close-button image-viewer-close" type="button" aria-label="关闭图片预览">×</button>
      <figure class="image-viewer-figure">
        <img id="image-viewer-image" src="" alt="">
        <figcaption id="image-viewer-caption">点击关闭</figcaption>
      </figure>
    </div>

    <div id="pause-overlay" class="modal-overlay" hidden>
      <section class="pause-panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <span class="panel-kicker">SYSTEM PAUSED</span>
        <h2 id="pause-title">旅程暂停</h2>
        <button id="resume-button" class="pixel-action" type="button">继续探索</button>
        <button id="pause-archive-button" class="pixel-action secondary" type="button">查看科技档案</button>
        <button id="return-menu-button" class="pixel-action secondary" type="button">返回主菜单</button>
      </section>
    </div>

    <div id="ending-overlay" class="modal-overlay ending-overlay" hidden>
      <section class="ending-panel" role="dialog" aria-modal="true" aria-labelledby="ending-speaker">
        <span class="ending-stars">✦　✦　✦</span>
        <h2 id="ending-speaker">铁世一</h2>
        <p id="ending-text"></p>
        <button id="ending-next" class="pixel-action" type="button">继续</button>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <audio id="bgm-player" loop preload="none"></audio>
  <audio id="voice-player" preload="none"></audio>

  <script src="js/game-data.js?v=20260830-web1"></script>
  <script src="js/game.js?v=20260830-web1"></script>
</body>
</html>
